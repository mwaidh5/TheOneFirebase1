
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The One Training</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;900&family=Lexend:wght@300;400;500;600;700;900&family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            // Touch devices fire a sticky :hover on tap. This gates every
            // hover: utility behind @media (hover: hover) so the app never
            // shows a stuck hover state after a finger press.
            future: { hoverOnlyWhenSupported: true },
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            DEFAULT: '#000000',
                            50: '#f6f6f6',
                            100: '#e7e7e7',
                            200: '#d1d1d1',
                            300: '#b0b0b0',
                            400: '#888888',
                            500: '#6d6d6d',
                            600: '#5d5d5d',
                            700: '#4f4f4f',
                            800: '#454545',
                            900: '#3d3d3d',
                            950: '#000000',
                        },
                        accent: '#137fec',
                        surface: '#f6f7f8',
                    },
                    fontFamily: {
                        display: ['Plus Jakarta Sans', 'sans-serif'],
                        body: ['Inter', 'sans-serif'],
                        lexend: ['Lexend', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        /* Prevent iOS rubber-band overscroll from revealing a black background
           behind the WebView: paint html white and damp the bounce. */
        html { background-color: #ffffff; overscroll-behavior-y: none; }
        body { background-color: #ffffff; overscroll-behavior-y: none; }
        /* Native app only: lock the page and scroll inside #root so the fixed
           bottom tab bar can't shift during overscroll. */
        html.native-app, html.native-app body { height: 100%; overflow: hidden; }
        html.native-app #root { height: 100%; overflow-y: auto; overflow-x: hidden; overscroll-behavior-y: none; -webkit-overflow-scrolling: touch; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        /* Slim, always-visible scrollbar for desktop horizontal boards, so the
           content off to the right is reachable with a plain mouse. */
        .thin-scrollbar::-webkit-scrollbar { height: 10px; }
        .thin-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .thin-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,.18); border-radius: 999px; }
        .thin-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,.35); }
        .thin-scrollbar { scrollbar-width: thin; scrollbar-color: rgba(0,0,0,.25) transparent; }
        /* ── Motion tokens ────────────────────────────────────────────
           Built-in CSS easings are too weak for UI. These are the curves
           the whole app animates on. */
        :root {
            --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
            --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
            --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
        }
        /* Press feedback. This is a phone app first, where hover never fires,
           so the press IS the affordance. Uses the independent `scale`
           property, not `transform`, so it composes with translate/rotate
           utilities instead of clobbering them. */
        button, [role="button"], .press {
            transition: scale 140ms var(--ease-out);
        }
        button:active:not(:disabled),
        [role="button"]:active,
        .press:active {
            scale: 0.97;
        }
        /* Fewer and gentler, not zero: keep opacity and colour, drop travel. */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 120ms !important;
                scroll-behavior: auto !important;
            }
            button:active:not(:disabled), [role="button"]:active, .press:active { scale: 1; }
        }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .material-symbols-outlined.filled { font-variation-settings: 'FILL' 1; }
        /* Arabic / RTL: swap body font to Cairo, keep ltr-locked things (timers, numbers) readable. */
        html[dir="rtl"] body, html[dir="rtl"] .font-body, html[dir="rtl"] .font-display, html[dir="rtl"] .font-lexend {
            font-family: 'Cairo', 'Tajawal', system-ui, sans-serif;
        }
        html[dir="rtl"] .tabular-nums { direction: ltr; unicode-bidi: isolate; display: inline-block; }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
<body class="font-body text-slate-900 bg-white min-h-screen">
    <div id="root">
      <!-- Inline splash: visible the instant the HTML arrives, before the JS
           bundle has downloaded. React replaces it on mount. On a slow
           connection the second line appears after a few seconds so the user
           knows the app is loading rather than broken. -->
      <div id="boot-splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#fff;font-family:'Plus Jakarta Sans',Inter,system-ui,sans-serif;">
        <div style="width:56px;height:56px;border-radius:18px;background:#000;display:flex;align-items:center;justify-content:center;">
          <div style="width:22px;height:22px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:boot-spin .8s linear infinite;"></div>
        </div>
        <div style="font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#000;">The One Training</div>
        <div id="boot-slow" style="font-size:12px;font-weight:600;color:#888;opacity:0;transition:opacity .3s;">Slow connection &mdash; still loading&hellip;</div>
        <style>@keyframes boot-spin{to{transform:rotate(360deg)}}</style>
      </div>
      <script>setTimeout(function(){var e=document.getElementById('boot-slow');if(e)e.style.opacity='1';},4000);</script>
    </div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
